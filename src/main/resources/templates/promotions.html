<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Promotions — HEI</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      h1 { color: #1f4e79; }
      table { border-collapse: collapse; margin-top: 1rem; }
      th, td { border: 1px solid #ccc; padding: 0.5rem 1rem; text-align: left; }
      a { color: #1f4e79; }
    </style>
  </head>
  <body>
    <h1>Liste des promotions</h1>
    <table>
      <thead>
        <tr><th>Promotion</th><th>Liste des diplômés</th></tr>
      </thead>
      <tbody>
        <tr th:each="entry : ${promotions}">
          <td th:text="${entry.value}">2021 (G)</td>
          <td>
            <a th:if="${isAdmin}" th:href="@{/promotions/{promotion}/diplomes(promotion=${entry.key})}">
              Télécharger la liste des diplômés
            </a>
            <span th:unless="${isAdmin}">—</span>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
